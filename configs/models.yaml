# Questions the matrix answers (used by analysis/summarize.py).
comparisons:
  # Q1: regional derivative of an older base vs latest general models
  regional_vs_latest:
    regional: [gotoai-gemma3-27b-it, qwen-sea-lion-v4.5-27b-it, sahabatai-gemma2-9b-it]
    latest: [qwen3.8-27b, gemma4-31b-it, gemma4-26b-a4b-it, gemma4-12b-it]
  # Q2: effect of regional continued pretraining = derived - base (paired bootstrap)
  # derived from the `pair` fields above.
