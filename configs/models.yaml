# Model matrix for indobench phase 0.
# revision = HF commit SHA, verified 2026-10-28 (huggingface_hub model_info).
# All models run BF16, text-only (vision/audio encoders disabled), non-thinking.
# bf16_gb = params x 2 bytes (weights only, excludes KV cache).

defaults:
  dtype: bfloat16
  max_model_len: 8192          # zero-shot MCQ prompts are short; keeps KV cache small
  gpu_memory_utilization: 0.90
  vllm_args:
    # Qwen3.5-arch models are hybrid (Mamba layers): one Mamba cache block per sequence,
    # and vllm's default 1024 exceeded the 637 blocks available on a 96 GB card (2026-10-28).
    max_num_seqs: 256
  thinking: off                # recorded in manifest
  # Passed as top-level lm_eval vllm model_args (lm_eval 0.4.13 vllm_causallms.py:85);
  # only takes effect with --apply_chat_template. Don't use chat_template_args (overwritten in 0.4.13).
  thinking_args:
    enable_thinking: false
  text_only: true              # multimodal models: no image/audio inputs
  text_only_args:
    language_model_only: true  # vllm 0.32 skips vision/audio towers (vllm/config/multimodal.py:304)
  # Strings removed from generations before scoring (spec IFEval-ID-Gaul §3).
  strip_markers: ["<think>", "</think>"]

models:
  # --- Pair A: Gemma 3 27B vs GoTo CPT (generasi lama + turunan regional) ---
  gemma3-27b-it:
    repo: google/gemma-3-27b-it
    revision: 005ad3404e59d6023443cb575daa05336842228a
    family: gemma3
    params_b: 27.4
    bf16_gb: 54.9
    gated: manual              # license must be accepted on HF before first run
    chat_template_notes: "Gemma 3 template, no thinking mode; enable_thinking kwarg is ignored."
    thinking: none
    thinking_args: {}

  gotoai-gemma3-27b-it:
    repo: GoToCompany/gemma3-27b-cpt-gotoai-v3-instruct
    revision: db3fb073bd44bf9554cbe6d9b94e54024cafcc37
    family: gemma3
    params_b: 27.43
    bf16_gb: 54.9
    pair: {role: derived, base: gemma3-27b-it, group: gemma3-goto}
    chat_template_notes: "Gemma 3 template (no thinking). Card does not declare base_model; pairing with gemma-3-27b-it is an assumption. Repo created 2025-12-03, last updated 2026-10-19."
    thinking: none
    thinking_args: {}

  # --- Pair B: Qwen3.6 27B vs Qwen-SEA-LION v4.5 27B ---
  qwen3.6-27b:
    repo: Qwen/Qwen3.6-27B
    revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
    family: qwen3_5
    params_b: 27.78
    bf16_gb: 55.6
    chat_template_notes: "Hybrid thinking template; enable_thinking=false gives an empty <think></think> block."

  qwen-sea-lion-v4.5-27b-it:
