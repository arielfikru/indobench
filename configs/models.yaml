    bf16_gb: 55.6
    pair: {role: derived, base: qwen3.6-27b, group: qwen36-sealion}
    chat_template_notes: "Qwen3.x hybrid thinking template; base lineage (Qwen3.6-27B) taken from model card text, not base_model metadata."

  # --- Pair C: Gemma 4 E2B vs Gemma-SEA-LION v4.5 E2B (smoke-test pair) ---
  gemma4-e2b-it:
    repo: google/gemma-4-E2B-it
